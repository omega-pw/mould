name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          target/release/mould
          target/release/*.so
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}