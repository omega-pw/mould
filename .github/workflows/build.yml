name: Build

on:
  workflow_dispatch

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add execute permission
      working-directory: ./build
      run: chmod +x ./build.sh
    - name: Build
      working-directory: ./build
      run: sudo ./build.sh
